</style>

 const sec=(t,items)=>el("div",{class:"card"},el("h2",{},t),el("ul",{class:"g"},items.map(x=>el("li",{},x))));
 m.append(sec("Ye software kya karta hai (1 se 4)",[

  "3) AAJ KI LIST: roz ka single jodi (kal ka GB number, FD+GL+DS par) aur har game ki 10 number ki list. Aaj ke result daalo to baad ke game ki list unke hisaab se badal jaati hai.",

 m.append(sec("Roz ka routine",[

 m.append(sec("Padhne ka tareeka",[
  "'Hit %' = 100 me kitni baar number aaya. Random = 1.00%. Break-even = 1.05% (95 guna par). Isse upar = paper par fayda.",
  "'Kam data' ka nishaan = us samay me number bahut kam baar aaya, isliye wahan ka dost pakka nahi.",
  "'x5.8' = us samay me ye dost overall se 5.8 guna zyada aaya. Chhote data me ye bada dikh sakta hai.",
  "Drift = dost badalna, jaise 10 par pehle 93 tha ab 94. Ye roz apne aap pakda jaata hai (Dost Khojo tab ke neeche)."]));
 m.append(sec("Sachchai (zaroor padho)",[
  "Result lagbhag random hain. Hamare 13 saal ke test me sirf chhota asar mila: number kuch din ke andar dobara aate hain (usi game me agle din nahi). Ye asar 2013-2018 me bada tha, 2022-25 me lagbhag gayab, 2026 me thoda wapas.",
  "Single jodi ~1.3% (break-even 1.05%), 10 number ki list ~1.1-1.2%. Matlab paper par chhota fayda, par bahut utaar-chadhaav. Mahine me 1-3 hit aate hain, aur ~30% mahine ek bhi nahi.",
  "Ye sirf paper trading aur software banane/seekhne ke liye hai. Asli paisa lagane ki salaah nahi."]));
 m.append(sec("Files / hosting",[
  "data/results.csv = poora record. data/paper_ledger.json = paper bet. data/monitor.json, drift_log.json = monitor aur badlaav.",
  "Roz 7:00 IST: .github/workflows/daily.yml. Phone se: scripts/fetch_now.sh. Web: Render (render.yaml); env me GITHUB_TOKEN aur ADMIN_PIN.",
  "Code: lab/ (data.py, friends.py, picks.py, paper.py, monitor.py, fetcher.py, update.py), lab_server.py (web), lab_static/index.html (ye page), tests/ (24 test)."]))},
};
const names={dost:"Dost Khojo",aaj:"Aaj ki List",paper:"Paper Trading",monitor:"Monitor",data:"Data/Fetch",guide:"Guide"};
async function go(t){
 document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.t===t));
 const m=$("#main"),tmp=el("div");m.replaceChildren(el("p",{class:"mut"},"Load ho raha hai..."));
 try{await tabs[t](tmp);m.replaceChildren(...tmp.childNodes)}catch(e){m.replaceChildren(el("div",{class:"warn"},e.message))}}
for(const[k,v]of Object.entries(names))$("#nav").append(el("button",{"data-t":k,on:{click:()=>go(k)}},v));
fetch("/api/status").then(r=>r.json()).then(s=>{ST=s;$("#meta").textContent=`${s.days} din | aakhri ${s.last_date} | khelne ki tarikh ${s.play_date}`}).catch(()=>{$("#meta").textContent=""}).finally(()=>go("dost"));
</script>
</body>
