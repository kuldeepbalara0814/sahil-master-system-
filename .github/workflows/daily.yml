name: daily-update

# Roz 8 baar auto fetch + scan (IST). Har result ke baad aur subah ka final:
#   FB  (~6:30-6:45 pm)  -> 18:45 (13:15 UTC) aur retry 19:15 (13:45 UTC)
#   GB  (~10:30 pm)      -> 22:45 (17:15 UTC) aur retry 23:15 (17:45 UTC)
#   GL  (~12:15 am)      -> 00:30 (19:00 UTC) aur retry 01:00 (19:30 UTC)
#   DS  (~5:30 am), FINAL-> 07:00 (01:30 UTC) aur retry 09:00 (03:30 UTC): line poori, sab pattern naye sire se
# GitHub kabhi 10-30 min der karta hai, isliye har result ka ek retry. Har baar: site se result (aadhi line bhi), paper trading, monitor,
# pattern scan; naye active pattern ho to app ke upar banner khabar (data/alerts.json). data/ ka badlav repo me commit hota hai
# (Render data/** par dobara deploy nahi karta). Manual: Actions tab -> daily-update -> Run workflow, ya app me "Abhi scan karo".
on:
  schedule:
    - cron: "30 1,3 * * *"
    - cron: "15,45 13 * * *"
    - cron: "15,45 17 * * *"
    - cron: "0,30 19 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tests (galat data na jaye)
        run: python -m unittest discover -s tests
      - name: Update (fetch + paper trading + monitor)
        run: python -m lab.update
      - name: Commit data
        run: |
          git config user.name "sahil-lab-bot"
          git config user.email "sahil-lab-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "kuch naya nahi"
          else
            git commit -m "auto: daily update $(date -u +%F)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
