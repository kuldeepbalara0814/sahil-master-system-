name: daily-update

# Roz 3 baar auto scan: (1) subah 7:00 IST (01:30 UTC, DS ke baad), (2) shaam 19:00 IST (13:30 UTC, FB ke baad),
# (3) raat 00:30 IST (19:00 UTC, GL ke baad). 03:30 UTC (9:00 IST) sirf dobara koshish hai (GitHub kabhi der karta hai).
# Har baar site se nayi line, paper trading, monitor aur pattern scan; data/ ka badlav repo me commit hota hai.
# Manual: Actions tab -> daily-update -> Run workflow, ya app me "Abhi scan karo".
on:
  schedule:
    - cron: "30 1,3 * * *"
    - cron: "30 13 * * *"
    - cron: "0 19 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tests (galat data na jaye)
        run: python -m unittest discover -s tests
      - name: Update (fetch + paper trading + monitor)
        run: python -m lab.update
      - name: Commit data
        run: |
          git config user.name "sahil-lab-bot"
          git config user.email "sahil-lab-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "kuch naya nahi"
          else
            git commit -m "auto: daily update $(date -u +%F)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
