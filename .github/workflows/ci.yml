name: code-tests

# Code badalne par saare tests. (Roz wali data Action me tests nahi chalte: koi purana test data update na roke.)
on:
  push:
    branches: [main]
    paths-ignore: ["data/**"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest tests.test_lab tests.test_core tests.test_fetcher tests.test_paper tests.test_server
      - run: python scripts/selfcheck.py --data --no-file
