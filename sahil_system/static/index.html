<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sahil Master System</title>
<style>
:root{--bg:#0f1220;--card:#181c30;--line:#2a3050;--tx:#e8ebf7;--mut:#8f97b8;--ac:#ffb020;--ok:#35c27a;--bad:#ef5b5b}
@media (prefers-color-scheme: light){:root{--bg:#f4f5fa;--card:#fff;--line:#d9dcea;--tx:#161a2e;--mut:#5d6585;--ac:#b86e00;--ok:#14804a;--bad:#c53030}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,sans-serif}
header{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
header b{font-size:17px}header small{color:var(--mut)}
nav{display:flex;overflow-x:auto;border-bottom:1px solid var(--line)}
nav button{flex:1;min-width:84px;padding:12px 8px;background:none;border:0;border-bottom:3px solid transparent;color:var(--mut);font:inherit;cursor:pointer}
nav button.on{color:var(--ac);border-color:var(--ac);font-weight:600}
main{max-width:720px;margin:0 auto;padding:14px 16px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
h2{margin:0 0 10px;font-size:16px}label{display:block;color:var(--mut);font-size:13px;margin:8px 0 3px}
input,select,button.b{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px}
input{width:100%}.row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.row2{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
button.b{cursor:pointer;background:var(--ac);color:#111;border-color:transparent;font-weight:600;margin-top:10px}
button.b.g{background:none;color:var(--tx);border-color:var(--line);font-weight:400}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.chip{padding:5px 10px;border-radius:999px;background:var(--bg);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.chip.l1{border-color:var(--ac);color:var(--ac);font-weight:700}
.f{display:flex;flex-wrap:wrap;gap:6px 14px}.f label{display:flex;gap:5px;align-items:center;margin:0;color:var(--tx)}.f input{width:auto}
table{width:100%;border-collapse:collapse}th,td{padding:7px 4px;border-bottom:1px solid var(--line);text-align:left;font-variant-numeric:tabular-nums}th{color:var(--mut);font-weight:500;font-size:13px}
.ok{color:var(--ok)}.bad{color:var(--bad)}.mut{color:var(--mut)}pre{white-space:pre-wrap;background:var(--bg);padding:10px;border-radius:8px;border:1px solid var(--line)}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--card);border:1px solid var(--line);padding:10px 16px;border-radius:10px;display:none;max-width:90%}
.warn{border-color:var(--ac);color:var(--ac);font-size:13px}
</style>
</head>
<body>
<header><b>Sahil Master System</b><small id="mode"></small></header>
<nav id="nav"></nav>
<main id="main"></main>
<div id="toast"></div>
<script>
"use strict";
const $=(s,r=document)=>r.querySelector(s);
const el=(t,a={},...k)=>{if(a===null||typeof a!=="object"||a instanceof Node||Array.isArray(a)){k.unshift(a);a={}}const e=document.createElement(t);for(const[x,v]of Object.entries(a)){if(x==="class")e.className=v;else if(x==="on")for(const[ev,fn]of Object.entries(v))e.addEventListener(ev,fn);else e.setAttribute(x,v)}for(const c of k.flat())e.append(c instanceof Node?c:String(c));return e};
const p2=n=>String(n).padStart(2,"0");
let cfg={today:new Date().toISOString().slice(0,10)};
function toast(m){const t=$("#toast");t.textContent=m;t.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display="none",3500)}
async function api(method,path,body,retry=true){
  const h={"Content-Type":"application/json"};let pin="";
  try{pin=localStorage.getItem("pin")||""}catch(e){}
  if(pin)h["X-Admin-Pin"]=pin;
  const r=await fetch("/api"+path,{method,headers:h,body:body?JSON.stringify(body):undefined});
  let j={};try{j=await r.json()}catch(e){}
  if(r.status===401&&retry){const x=prompt("Likhne ke liye PIN dalo:");if(x){try{localStorage.setItem("pin",x)}catch(e){}return api(method,path,body,false)}}
  if(!r.ok)throw new Error(j.error||("Galti "+r.status));
  return j}
const num=v=>{const n=parseInt(v,10);return Number.isInteger(n)&&n>=0&&n<=99?n:null};
function four(root){const v=["fd","gb","gl","ds"].map(k=>num($("#"+k,root).value));return v.includes(null)?null:{fd:v[0],gb:v[1],gl:v[2],ds:v[3]}}
function inputs4(vals={}){return el("div",{class:"row"},["fd","gb","gl","ds"].map(k=>el("div",{},el("label",{for:k},k.toUpperCase()),el("input",{id:k,inputmode:"numeric",maxlength:"2",placeholder:"00",value:vals[k]??""}))))}
function chips(list,cls){return el("div",{class:"chips"},list.map(x=>el("span",{class:"chip "+cls},x)))}
const FL={2:"Evergreen +7",3:"Universal +10",4:"Magic +15",5:"Day Fix +5",6:"Murda +10",7:"Haruf +5",8:"Baki +3",9:"Month Trend +3"};
function formulaBox(sel){return el("div",{class:"f",id:"fl"},Object.entries(FL).map(([k,v])=>el("label",{},el("input",{type:"checkbox",value:k,...(sel.includes(k)?{checked:""}:{})}),v)))}
const picked=()=>[...document.querySelectorAll("#fl input:checked")].map(i=>i.value);
function nextDay(d){const t=new Date(d+"T00:00:00Z");t.setUTCDate(t.getUTCDate()+1);return t.toISOString().slice(0,10)}

const tabs={
async predict(m){
  const recs=await api("GET","/sahil/records");const last=recs[recs.length-1];
  const out=el("div");
  const box=el("div",{class:"card"},el("h2","Prediction"),
    last?el("p",{class:"mut"},`Aakhri record: ${last.date} (${p2(last.fd)} ${p2(last.gb)} ${p2(last.gl)} ${p2(last.ds)}). Neeche wahi bhara hai; badal sakte ho.`):"",
    inputs4(last?{fd:p2(last.fd),gb:p2(last.gb),gl:p2(last.gl),ds:p2(last.ds)}:{}),
    el("label",{for:"gd"},"Game ki date"),el("input",{id:"gd",type:"date",value:last?nextDay(last.date):cfg.today}),
    el("label","Formula"),formulaBox(["2","5","6"]),
    el("label","Amount (parcha ke liye, optional)"),
    el("div",{class:"row2"},["a1","a2","a3"].map((k,i)=>el("input",{id:k,inputmode:"numeric",placeholder:"L"+(i+1)+" Rs"}))),
    el("button",{class:"b",on:{click:async()=>{
      const v=four(box);if(!v)return toast("FD GB GL DS (0-99) sahi dalo");
      try{const r=await api("POST","/sahil/predict",{...v,gameDate:$("#gd").value,formula:picked()});show(r,v)}catch(e){toast(e.message)}}}},"Prediction nikalo"));
  function show(r,v){out.replaceChildren();
    const amt=["a1","a2","a3"].map(k=>parseInt($("#"+k).value,10)||0);
    const lines=["*** SAHIL PARCHA *** "+r.gameDate];let total=0;
    [["L1",r.L1,amt[0]],["L2",r.L2,amt[1]],["L3",r.L3,amt[2]]].forEach(([n,l,a])=>{if(a){total+=a*l.length;lines.push(`${n} (${a} into): ${l.join(", ")}  [${l.length} x ${a} = Rs ${a*l.length}]`)}else lines.push(`${n}: ${l.join(", ")}`)});
    if(total)lines.push("Total: Rs "+total);const txt=lines.join("\n");
    out.append(el("div",{class:"card"},el("h2","L1 (4 number)"),chips(r.L1,"l1"),el("h2","L2 (10 number)"),chips(r.L2,""),el("h2","L3 (16 number)"),chips(r.L3,""),
      el("pre",{},txt),el("button",{class:"b g",on:{click:()=>navigator.clipboard.writeText(txt).then(()=>toast("Copy ho gaya"),()=>toast("Copy nahi hua"))}},"Parcha copy karo")),
      el("div",{class:"card"},el("h2","Tokari (kitni baar aaya)"),el("div",{class:"chips"},r.tokari.slice(0,24).map(t=>el("span",{class:"chip"},`${t.jodi} [${t.count}]`)))))}
  m.append(box,out)},

async result(m){
  const card=el("div",{class:"card"},el("h2","Naya result"),
    el("p",{class:"mut"},"Date = jis din ka FD/GB/GL hai. DS = us date ke AGLE din subah ka Desawar. Mahine ke 30/31 aur jis din result nahi aaya, wo date chhod do."),
    el("label",{for:"d"},"Date"),el("input",{id:"d",type:"date",value:cfg.today}),inputs4(),
    el("button",{class:"b",on:{click:async()=>{
      const v=four(card);if(!v)return toast("Chaaron number (0-99) dalo");
      try{const r=await api("POST","/sahil/records",{date:$("#d").value,...v});toast(r.message)}catch(e){toast(e.message)}}}},"Record me save karo"));
  m.append(card)},

async records(m){
  const recs=(await api("GET","/sahil/records")).reverse();
  const q=el("input",{placeholder:"Date khojo (jaise 2026-11)"});const tb=el("tbody");
  const edit=el("div");
  const draw=()=>{tb.replaceChildren();recs.filter(r=>r.date.includes(q.value.trim())).slice(0,80).forEach(r=>tb.append(el("tr",{},
    el("td",{},r.date),...["fd","gb","gl","ds"].map(k=>el("td",{},p2(r[k]))),
    el("td",{},el("button",{class:"b g",style:"margin:0;padding:3px 8px",on:{click:()=>openEdit(r)}},"Edit")))))};
  function openEdit(r){edit.replaceChildren(el("div",{class:"card"},el("h2","Edit: "+r.date),inputs4({fd:p2(r.fd),gb:p2(r.gb),gl:p2(r.gl),ds:p2(r.ds)}),
    el("button",{class:"b",on:{click:async()=>{const v=four(edit);if(!v)return toast("Sahi number dalo");
      try{const x=await api("PUT","/sahil/records/"+r.date,v);toast(x.message);Object.assign(r,v);edit.replaceChildren();draw()}catch(e){toast(e.message)}}}},"Update karo")));scrollTo(0,0)}
  q.addEventListener("input",draw);draw();
  m.append(edit,el("div",{class:"card"},el("h2",`Record (${recs.length} din)`),q,el("table",{},el("thead",{},el("tr",{},["Date","FD","GB","GL","DS",""].map(h=>el("th",{},h)))),tb)))},

async tracker(m){
  const[s,list]=await Promise.all([api("GET","/sahil/stats"),api("GET","/sahil/predictions")]);
  m.append(el("div",{class:"card"},el("h2","Pass / Fail"),el("p",{},`Total ${s.total} | Pass ${s.passed} (L1 ${s.passL1}, L2 ${s.passL2}, L3 ${s.passL3}) | Fail ${s.failed} | Baaki ${s.pending}`),
    el("p",{class:"mut"},s.total-s.pending?`Success rate: ${s.successRate}%`:"Abhi koi result check nahi hua.")),
    el("div",{class:"card"},el("h2","Pichli predictions"),el("table",{},el("tbody",{},list.slice(0,60).map(p=>el("tr",{},el("td",{},p.gameDate),
      el("td",{class:p.status.startsWith("PASS")?"ok":p.status==="FAIL"?"bad":"mut"},p.status.replace("_"," ")),el("td",{class:"mut"},(p.matched||[]).join(" "))))))));},

async backtest(m){
  const out=el("div"),all=el("div",{class:"card"},el("h2","Sab formula ki list"),el("p",{class:"mut"},"Load ho raha hai..."));
  api("GET","/sahil/backtest/all").then(r=>{const f=x=>`${x.hit} (${x.random})`;all.replaceChildren(el("h2","Sab formula ki list"),
    el("p",{class:"mut"},`${r.days} din (${r.from} se ${r.to}). Bracket me random. Har naya result judne par ye apne-aap taaza hota hai.`),
    el("table",{},el("thead",{},el("tr",{},["Formula","L1 4","L1+L2 14","Top 30"].map(h=>el("th",{},h)))),el("tbody",{},
      r.rows.map(x=>el("tr",{},el("td",{},(x.id.length===1&&x.id!=="-"?x.id+" ":"")+x.name),el("td",{},f(x.L1)),el("td",{},f(x.L1L2)),
        el("td",{class:x.top30.hit-x.top30.random>0?"ok":"bad"},f(x.top30)))))),el("p",{class:"mut"},r.note))}).catch(e=>all.replaceChildren(el("p",{class:"bad"},e.message)));
  m.append(all,el("div",{class:"card"},el("h2","Backtest: formula sach me kaam karta hai?"),
    el("p",{class:"mut"},"Har din ka predict, agle din ke asli result se match. 'Random' = bina soche utne number chunne ka chance. Farak chhota ho to formula ka koi asli fayda nahi."),
    el("label","Formula"),formulaBox(["2","5","6"]),
    el("button",{class:"b",on:{click:async()=>{out.textContent="Chal raha hai...";
      try{const r=await api("GET","/sahil/backtest?formula="+picked().join(""));out.replaceChildren(
        el("p",{class:"mut"},`${r.days} din (${r.from} se ${r.to})`),
        el("table",{},el("thead",{},el("tr",{},["List","Hit %","Random %","Farak"].map(h=>el("th",{},h)))),el("tbody",{},
          [["L1 (4)",r.L1],["L1+L2 (14)",r.L1L2],["Top 30",r.top30]].map(([n,x])=>{const d=Math.round((x.hit-x.random)*10)/10;
            return el("tr",{},el("td",{},n),el("td",{},x.hit),el("td",{},x.random),el("td",{class:d>0?"ok":"bad"},(d>0?"+":"")+d))}))),
        el("p",{class:"mut"},r.note))}catch(e){out.textContent=e.message}}}},"Chalao"),out))}
};
const names={predict:"Predict",result:"Result",records:"Record",tracker:"Tracker",backtest:"Backtest"};
async function go(t){
  document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.t===t));
  const m=$("#main");m.replaceChildren(el("p",{class:"mut"},"Load ho raha hai..."));
  const box=document.createDocumentFragment();const tmp=el("div");
  try{await tabs[t](tmp);m.replaceChildren(...tmp.childNodes)}catch(e){m.replaceChildren(el("div",{class:"card bad"},e.message))}}
for(const[k,v]of Object.entries(names))$("#nav").append(el("button",{"data-t":k,on:{click:()=>go(k)}},v));
fetch("/api/sahil/config").then(r=>r.json()).then(c=>{cfg=c;$("#mode").textContent=c.github?"GitHub sync ON":"local mode"}).catch(()=>{}).finally(()=>go("predict"));
</script>
</body>
</html>
